# ------------------------------------------------------------------ constantes DERIVADAS (no son entradas)
# Se calcularán en electron_losses_IGM/src/igm_losses/constants.py desde las primarias de arriba y se
# verificarán con sympy (C25). Se listan aquí sólo para dejar constancia de cómo las obtiene el notebook.
derived_in_code:
  eps0:           {formula: "1/(mu0 c²)", unit: "F m-1"}
  hbar:           {formula: "h/(2π)", unit: "J s"}
  m_e_c2:         {formula: "m_e c²", unit: "J"}
  r_e:            {formula: "e²/(4π eps0 m_e c²)", unit: "m"}
  alpha:          {formula: "e²/(2 eps0 h c)", unit: ""}
  Ry_inf:         {formula: "α² m_e c²/2", unit: "J"}
  R_H:            {formula: "Ry_inf · m_p/(m_e + m_p)", unit: "J", note: "A12: umbral de ionización y escala de niveles del H (el notebook usaba Ry_inf)"}
  sigma_T:        {formula: "(8π/3) r_e²", unit: "m2"}
  a0:             {formula: "ħ/(m_e c α)", unit: "m"}
  a_rad:          {formula: "8π⁵ k_B⁴/(15 h³ c³)", unit: "J m-3 K-4", note: "reemplaza U_CMB_0 = 4.17e-14 escrito a mano (E04)"}
  E_exc_n:        {formula: "Tabla 1 de StoneKimDesclaux2002 (E_n para n = 2…10; E_2 = 10.204 eV)", unit: "eV", note: "E19: no se deriva de R_H"}
  n_H:            {formula: "(1 - Y_p) Ω_b ρ_crit,0 (1+z)³ / m_p, ρ_crit,0 = 3 H0²/(8πG) (Planck18)", unit: "m-3"}
  B:              {formula: "B0 (1+z)²", unit: "T"}
  T_CMB:          {formula: "T_CMB0 (1+z)", unit: "K"}
  U_CMB:          {formula: "a_rad T_CMB⁴", unit: "J m-3"}

