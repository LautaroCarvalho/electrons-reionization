thesis: 'Un electrón inyectado en z = 10 en el medio intergaláctico (B0 = 1 nG, fracción de ionización constante entre 1e-4
  y 0.99) pierde su energía cinética por Compton inverso sobre el CMB por encima de ~1e5 eV y por colisiones con el gas por
  debajo: ionización y excitación del H neutro cuando el gas es casi neutro, y Coulomb con los electrones libres a medida
  que x_e crece (en todo el rango colisional para x_e ≥ 0.5). Sincrotrón, bremsstrahlung y expansión adiabática no dominan
  en ningún punto del rango estudiado, y un electrón con K_ini ≥ 1e9 eV termaliza en un redshift que casi no depende de su
  energía inicial.'
