# =====================================================================
#  parameters.yaml  --  THE editable source of truth for this project.
#
#  Every scenario parameter lives here and nowhere else. Python modules
#  read it through python/parameters.py; inputs_table.tex is generated
#  from it; the manuscripts reach it through the provenance registries.
#  Edit this file and re-run `python3 run_all.py` to regenerate the whole
#  project for a different scenario.
#
#  EVERY entry carries:
#     value    the number (or [lo, hi] for a range)
#     units    never omitted, even when dimensionless ("--")
#     source   a key in papers/references.bib, or "" if none is claimed
#     status   V verified against a source that is in papers/
#              C cited, but not checked against the source's equations
#              D derived in this project from other entries here
#              S a scanned parameter -- a range, not a measurement
#              U your choice; no external source claimed
#              X conventional, but THIS PROJECT HAS ESTABLISHED NO SOURCE
#     note     why it has this value, and any tension with the literature
#
#  CODATA constants and atomic cross-section coefficients are NOT here.
#  They are not scenario knobs, and relocating them would add risk with
#  no benefit. They stay in ionization_yield.py / igm_losses.py.
# =====================================================================

meta:
  scenario_name: fiducial-z10
  description: >
    Neutral IGM at z = 10, x_e held static at 1e-4, pure atomic hydrogen at
    mean density. Stellar UV photons versus SN-accelerated CR electrons as
    reionization agents.

# ---------------------------------------------------------------- cosmology
cosmology:
  h:            {value: 0.6766,   units: "--", source: Planck2020, status: C}
  Omega_m:      {value: 0.3111,   units: "--", source: Planck2020, status: C}
  Omega_b_h2:   {value: 0.02242,  units: "--", source: Planck2020, status: C}
  T_cmb0:       {value: 2.7255,   units: K,    source: Fixsen2009, status: C}
  Y_P:          {value: 0.245,    units: "--", source: Planck2020, status: C,
                 note: "primordial He mass fraction, BBN + Planck"}

# ----------------------------------------------------------------- scenario
scenario:
  z:            {value: 10.0,     units: "--", source: "", status: U,
                 note: "the snapshot. Change this and re-run to move redshift."}
  x_e:          {value: 1.0e-4,   units: "--", source: "", status: U,
                 note: "held STATIC. Releasing it breaks the linear-yield
                        regime the whole W-value construction rests on:
                        N_gamma(1 keV) falls 26.4 -> 2.9 from x_e 1e-4 to 0.5."}
  Z_target:     {value: 1.0,      units: "--", source: "", status: U,
                 note: "pure hydrogen target, no helium"}
  B0_tesla:     {value: 1.0e-13,  units: T,    source: "", status: U,
                 note: "1 nG comoving; B(z) = B0 (1+z)^2"}

# -------------------------------------------------------------- photon band
# Band policy, settled 2026-09-15: the top is
#     min(source emission cutoff, IGM transparency cutoff)
# because 4 Ryd is a property of STELLAR spectra (He II edge) while tau = 1
# is a property of the IGM. Before this, three conventions coexisted and the
# project reported both 2.280x and 2.073x for the same statement.
photon_band:
  policy:       per_source
  E_min_eV:     {value: 13.598434599702, units: eV, source: NIST_ASD, status: V,
                 note: "HI ionization potential. A PHYSICAL floor, not a choice."}
  stellar_cutoff_ryd:
                {value: 4.0,      units: Ryd,  source: "", status: U,
                 note: "conventional top of the stellar LyC band; He II opacity
                        takes over above it and BPASS spectra drop there"}
  igm_cutoff:   {value: derived,  units: eV,   source: "", status: D,
                 note: "energy at which tau_IGM = 1 over one Hubble length,
                        solved from this project's own sigma_photoion.
                        1218 eV at z = 10."}

# ----------------------------------------------------------- stellar source
stellar_source:
  log_rho_UV:   {value: 25.12,    units: "log10(erg s^-1 Hz^-1 cMpc^-3)",
                 source: Donnan2024, status: V,
                 note: "Table 3, z = 10 row. CAVEAT still unstated in the
                        manuscript: integrated only to M_UV = -17."}
  log_rho_UV_err:
                {value: [-0.08, 0.07], units: dex, source: Donnan2024, status: V,
                 note: "asymmetric 1-sigma as published"}
  log_xi_ion:   {value: 25.28,    units: "log10(Hz erg^-1)",
                 source: Llerena2025, status: V,
                 note: "median at z ~ 7.14; their own fit extrapolates to 25.42
                        at z = 10, so 25.28 is conservative for photons"}
  xi_ion_scatter_dex:
                {value: 0.42,     units: dex,  source: Llerena2025, status: V,
                 note: "OBSERVED scatter, not an error bar"}
  K_UV:         {value: 1.15e-28, units: "Msun yr^-1 / (erg s^-1 Hz^-1)",
                 source: MadauDickinson2014, status: V,
                 note: "eq. (10), Salpeter 0.1-100 Msun. TRUNCATED form."}
  sed_model:    {value: powerlaw, units: "--", source: "", status: U,
                 note: "'powerlaw' or 'blackbody'; blackbody kept as the
                        comparison case only"}
  sed_alpha:    {value: 2.0,      units: "--", source: "", status: U,
                 note: "f_nu ~ nu^-alpha. OUR PARAMETRISATION, not a measured
                        value: Marques-Chaves+26 report beta_UV = -2.88 over
                        lambda_rest >= 1400 A and NO LyC index. The only direct
                        measurement in our band is Murchikova+20's 4.5 +- 0.4
                        (13.6-54.4 eV), but from four GALACTIC HII regions."}
  sed_alpha_range:
                {value: [1.0, 3.0], units: "--", source: "", status: S}
  T_eff_K:      {value: 5.0e4,    units: K,    source: "", status: U,
                 note: "blackbody comparison case only"}
  imf_slope:    {value: 2.35,     units: "--", source: Salpeter1955, status: V,
                 note: "fitted for 0.4-10 Msun only"}
  imf_mass_limits:
                {value: [0.1, 100.0], units: Msun, source: MadauDickinson2014,
                 status: C, note: "range adopted to match K_UV"}
  m_sn_min:     {value: 8.0,      units: Msun, source: "", status: U,
                 note: "core-collapse threshold"}

# -------------------------------------------------------- cosmic-ray channel
# NOTE: every entry in this block that is in tension with the literature has
# been RETAINED at the project value by explicit decision (2026-09-15). The
# tension is recorded, not applied. All five lean the same way -- generous to
# the CR channel -- so the photons-win conclusion is a LOWER BOUND on the gap.
cr_channel:
  E_SN_erg:     {value: 1.0e51,   units: erg,  source: "", status: X,
                 note: "standard core-collapse budget; NO source established
                        by this project"}
  eps_CR:       {value: 0.1,      units: "--", source: CaprioliSpitkovsky2014,
                 status: C,
                 note: "RETAINED. Hybrid sims give 10-20% at parallel and
                        quasi-parallel shocks but ZERO at quasi-perpendicular,
                        so an obliquity-averaged value would be lower. Not
                        applied: keeping 0.1 is generous to CRs."}
  f_e:          {value: 0.01,     units: "--", source: Park2015, status: C,
                 note: "RETAINED. This is K_ep measured at EARTH. Park+15
                        derive 1-3e-3 at realistic SNR shock speeds and
                        1.6e-3 for Tycho, so 0.01 is 3-10x high. Not applied."}
  eps_CR_f_e:   {value: 1.0e-3,   units: "--", source: "", status: S,
                 note: "the product actually used; = eps_CR x f_e"}
  index:        {value: 2.2,      units: "--", source: "", status: U,
                 note: "dN/dE ~ E^-index. Your choice, revised from 2.1.
                        DSA strong-shock theory predicts exactly 2.0
                        (Park+15: f(p) ~ p^-3r/(r-1), r = 4)."}
  E_min_eV:     {value: 1.0e3,    units: eV,   source: "", status: U,
                 note: "RETAINED. A convention with no source. Park+15's DSA
                        injection momentum p_inj ~ 3 m_p v_u puts the electron
                        power law at 28-56 MeV for young-SNR v_u = 0.01-0.02c,
                        four to five decades higher. Not applied: it would move
                        X_comp 2.07 -> 3.69. This is the single least
                        constrained input in the project -- it slides the whole
                        X_comp map by more than its own axis does."}
  E_max_eV:     {value: 1.0e12,   units: eV,   source: "", status: U}
  f_dep:        {value: 1.0,      units: "--", source: "", status: U,
                 note: "assumption A11: every injected electron deposits in the
                        IGM. A CEILING on the electron channel, not an estimate."}

# ------------------------------------------------------------ scanned ranges
scanned:
  f_esc:        {value: 0.10,     units: "--", source: "", status: S,
                 note: "RETAINED convention. The alternative f_esc/(1-f_esc)
                        normalisation would raise zeta_gamma by 11%. Not
                        applied. The canonical 0.10 is a convention, not a
                        measurement."}
  f_esc_range:  {value: [1.0e-6, 1.0], units: "--", source: "", status: S}
  eps_CR_f_e_range:
                {value: [1.0e-6, 1.0], units: "--", source: "", status: S,
                 note: "bounded above by unity on energy grounds"}
  rho_sfr_scale:
                {value: 1.0,      units: "--", source: "", status: S,
                 note: "multiplier on Donnan+24; ignorance band at z = 20 only"}
  jet_e_frac:   {value: [1.0e-3, 1.0], units: "--", source: "", status: S,
                 note: "RETAINED. Jet efficiency x leptonic fraction, scanned
                        because the proton content of jets is not
                        observationally constrained. BUT Aharonian+24 MEASURE
                        1.3e-3 for SS 433 -- the very bottom of this range. The
                        AGN parity crossing in the budget plane lives at the
                        top of this scan, which that measurement argues
                        against. Not applied."}

# ----------------------------------------------------------- source classes
# Spectral indices, with the band each was MEASURED over. Our photon band is
# 13.598-1218 eV; an index fitted at 2-10 keV has ZERO overlap with it.
source_classes:
  agn_radio_quiet:
    alpha_gamma: {value: 1.57, units: "--", source: Telfer2002, status: V,
                  note: "+-0.17; fit over 500-1200 A = 10.3-24.8 eV, which
                         covers only 13% of our band in log energy"}
  agn_radio_loud:
    alpha_gamma: {value: 1.96, units: "--", source: Telfer2002, status: V,
                  note: "+-0.12; same partial-band caveat"}
  agn_eor_template:
    alpha_gamma: {value: 1.5,  units: "--", source: Graziani2018, status: V,
                  note: "S(nu) ~ nu^-1.5 over 13.6 eV - 3 keV: the ONLY index
                         covering 100% of our band"}
    lyc_budget_fraction:
                 {value: [0.17, 0.3333], units: "--", source: Asthana2024,
                  status: V,
                  note: "17% (Asthana+24) to <=1/3 (Jiang+25), both at z ~ 7.5.
                         Carried to z = 10, conservative for photons."}
  ulx:
    Gamma_1:     {value: [1.38, 3.1], units: "--", source: Gladstone2009,
                  status: V,
                  note: "alpha = Gamma - 1. Fitted at 2-10 keV: NO overlap with
                         our band, and in our band ULXs are disc- not
                         corona-dominated (kT_in 0.17-1.7 keV)."}
    E_break_keV: {value: [3.5, 7.0], units: keV, source: Gladstone2009, status: V}
    delta_Gamma: {value: [1.0, 2.0], units: "--", source: Gladstone2009, status: V}
  bhb_hard_state:
    Gamma:       {value: 1.7,  units: "--", source: Gladstone2009, status: X,
                  note: "SECOND-HAND. Only Gamma < 2.1 for the low/hard state is
                         first-hand (Gladstone+09 sec 4.1). Fitted at 2-10 keV:
                         no overlap with our band. This is the class showing the
                         LARGEST spectral effect, resting on the weakest index."}
  star_forming:
    alpha_gamma_measured:
                 {value: 4.5,  units: "--", source: Murchikova2020, status: V,
                  note: "+-0.4 over 13.6-54.4 eV, L_nu ~ nu^-gamma: EXACTLY our
                         convention, no conversion. The only direct measurement
                         in our band. But four GALACTIC HII regions at roughly
                         solar metallicity, and the authors find it disagrees
                         with BPASS/Starburst99. Metal-poor z~10 should be
                         harder (smaller)."}
    alpha_e_dsa: {value: [2.0, 2.5], units: "--", source: Park2015, status: V,
                  note: "from their own f(p) ~ p^-3r/(r-1): r = 4 (strong shock)
                         gives exactly 2.0, r = 3 gives 2.5"}
  ss433_jets:
    alpha_e:     {value: 2.0,  units: "--", source: Aharonian2024, status: V,
                  note: "Gamma_e = 2 with dN/dE ~ E^-Gamma_e, EXACTLY our
                         convention. E_cut > 200 TeV. Electron power measured
                         above 10 MeV = 0.13% of a 1e39 erg/s jet."}
    L_mech_erg_s:
                 {value: [1.0e39, 1.0e40], units: erg/s, source: Mirabel2011,
                  status: V, note: "SS 433 and the S26 microquasar"}

# ------------------------------------------------ X-ray binary / AGN scalings
accretion_sources:
  lehmer_norm:  {value: 1.8e39, units: "erg s^-1 / (Msun yr^-1)",
                 source: Lehmer2016, status: V,
                 note: "eq. (6), 2-10 keV, x (1+z)^1; exponent fixed at 1"}
  lehmer_norm_err:
                {value: [1.4e39, 2.3e39], units: "erg s^-1 / (Msun yr^-1)",
                 source: Lehmer2016, status: V}
  L_edd_per_msun:
                {value: 1.5e38, units: "erg s^-1 Msun^-1", source: Mirabel2011,
                 status: V, note: "eqs. (3)-(4)"}
  f_edd:        {value: 0.1,    units: "--", source: Mirabel2011, status: V,
                 note: "their own fiducial; they call it conservative"}
  f_2_10:       {value: 0.1,    units: "--", source: Mirabel2011, status: V}
  M_BH_range:   {value: [5.0, 30.0], units: Msun, source: "", status: U,
                 note: "OUR choice; box position scales linearly with it"}
  M_UV_U37126:  {value: -20.10, units: AB, source: MarquesChaves2026, status: V,
                 note: "+-0.05, z = 10.255, lensed mu ~ 2.2"}

# ------------------------------------------------------ reionization budget
budget:
  chi_He:       {value: 1.08,   units: "--", source: MadauDickinson2014,
                 status: V, note: "derived here as 1 + (Y_P/4)/X_H = 1.0811"}
  alpha_B_2e4K: {value: 1.43e-13, units: "cm^3 s^-1",
                 source: OsterbrockFerland2006, status: V}
  clumping_factors:
                {value: [1.0, 3.0, 12.0], units: "--", source: "", status: S}
  redshifts:    {value: [20.0, 10.0, 5.5], units: "--", source: "", status: U}

# ------------------------------------------------------------------ numerics
numerics:
  zeta_n:       {value: 4001,   units: "--", source: "", status: U,
                 note: "quadrature resolution for every zeta integral. Raised
                        from 400 because the trapezoid error sat on a rounding
                        boundary and put 5600 in the paper instead of 5599."}
  master_grid_n:
                {value: 2400,   units: "--", source: "", status: U,
                 note: "cached N_gamma / N_e master grid"}
  quad_tol:     {value: 1.0e-3, units: "--", source: "", status: D,
                 note: "tolerance for checks comparing two quadratures of
                        N_gamma. MEASURED, not chosen: W_gamma oscillates by
                        4.98e-5 between n = 1200 and 9600, and does NOT fall as
                        h^2, so this is the interpolation noise floor of
                        IY.N_gamma itself."}
  e_top_master_eV:
                {value: 1.0e5,  units: eV,   source: "", status: U,
                 note: "above this the IGM is utterly transparent"}
