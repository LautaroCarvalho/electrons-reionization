claims:
  - id: yield_is_linear_below_Ecrit
    statement: >
      Below the critical energy the HI ion-pair yield is linear in the
      primary energy, N = f_ion E / E_th, equivalently one ion pair per
      W = 36 eV deposited.
    evidence:
      - ionization_yield.py::N_e_full
      - Shull & van Steenberg 1985, ApJ 298, 268 (deposition fractions)
      - independent literature value W(H) ~ 36 eV per ion pair
    numbers: [W_eV_per_ion_pair]
  - id: ic_branching
    statement: >
      At z = 10 an electron above E_crit ~ 130 keV gives its energy to
      the CMB by inverse Compton rather than to the gas by collisions,
      so the COLLISIONAL ionization yield saturates.
    evidence:
      - ionization_yield.py::N_e_ic
      - ionization_yield.py::run_checks (saturation, E_crit two ways)
      - Rybicki & Lightman 1979, eq. 7.16 (IC loss rate)
    numbers: [E_crit_eV, N_e_ic_1e12]
  - id: ic_secondary_reprocessing
    statement: >
      That energy is not lost. Between roughly 10 MeV and 1 GeV the
      electron upscatters CMB photons past 13.6 eV and below the 1.2 keV
      escape energy, so they photoionize. Following them raises the
      saturated yield of a 1 TeV electron by nearly three orders of
      magnitude over the collisional-only value.
    evidence:
      - ionization_yield.py::ICPhotonChannel
      - Blumenthal & Gould 1970, Rev. Mod. Phys. 42, 237, eq. (2.42)
      - ionization_yield.py::run_checks (spectrum normalisation and
        mean two ways; <w> against the closed form; N_secondary by
        trapezoid and by adaptive quad; A=0 and A=1 structural cases)
    numbers: [E_escape_eV, ic_turnon_T_eV_half, N_e_depfit_1e+12,
              ic_transport_spread_max]
  - id: full_absorption_is_not_an_upper_bound
    statement: >
      The asymptotic ceiling is an upper bound on collisional degradation only, not on
      the total yield: energy reprocessed into photons just above 13.6
      eV buys one ion pair per 13.6 eV instead of one per W = 36.3 eV,
      so the depfit route exceeds the asymptotic ceiling by a few per cent near 1e8 eV. The one
      strict ceiling is E/E_th, and it is not crossed.
    evidence:
      - ionization_yield.py::run_checks (ENERGY BOUND check)
      - ionization_yield.py::main (the ratio, computed on the grid)
    numbers: [N_e_depfit_over_A_max]
  - id: fixed_W_is_the_weak_point
    statement: >
      W is treated as energy-independent, because f_ion depends on
      x_e alone. That is sound above ~1 keV, where W is
      experimentally flat, but the IC channel deposits most
      efficiently near threshold and a quarter of the secondary
      yield is made below 100 eV, outside the fit's stated domain.
      Imposing the exact sub-threshold floor costs 1.1 per cent;
      the pessimistic bracket on the 13.6-100 eV band is -10.1 per
      cent. This is the largest modelling bracket on the headline
      number and it is one-sided.
    evidence:
      - ionization_yield.py::run_checks (band decomposition and the
        pe_floor_eV variant and the f_ion_model switch)
      - Shull & van Steenberg 1985 (asymptotic branch, E >~ 100 eV)
    numbers: [ic_frac_of_secondary_below_100eV,
              N_e_depfit_1e12_pe_floor_100eV,
              ic_W_energy_dependence_reduction, W_ion_only_eV]
  - id: photon_threshold
    statement: >
      Photons below 13.6 eV produce exactly zero HI ionizations; the
      photon curve therefore has a hard threshold, and above it the
      photon yield exceeds the electron yield by the one primary
      ionization the photon itself causes. Over the requested photon
      range the photoelectron is far too slow to upscatter anything, so
      models B and C coincide for photons.
    evidence:
      - ionization_yield.py::N_gamma
      - NIST ASD, HI ionization energy 13.598 eV
    numbers: []
figures:
  - file: ionization_yield_fig.png
    produced_by: ionization_yield.py::make_figure
    shows: >
      Upper panel: HI ion pairs per primary against primary kinetic
      energy, for electrons and photons, under the three models, with
      the E/E_th ceiling drawn. Lower panel: the two branching
      fractions that set the shape -- the share of electron energy
      going to the gas, and the share of IC-radiated energy that
      returns as an absorbed ionizing photon.
    from_scratch: all curves
    from_library: matplotlib for rendering only
    choices:
      - 'colour encodes species, line style encodes model, so identity
         is never carried by colour alone'
      - 'log-log axes: the yield spans 14 decades'
      - 'the photon curves are stroked wide and the electron curves
         narrow on top, because above 100 eV the two genuinely
         coincide and a plain overplot would hide one of them'
    supports: [yield_is_linear_below_Ecrit, ic_branching,
               ic_secondary_reprocessing,
               full_absorption_is_not_an_upper_bound, photon_threshold,
               fixed_W_is_the_weak_point]
